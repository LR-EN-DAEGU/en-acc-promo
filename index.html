<title>2609 대구서비스센터 펫 악세서리 50%할인 프로모션</title>

<style>
  :root {
    --bg: #f4f4f5;
    --card: #ffffff;
    --text: #18181b;
    --muted: #71717a;
    --line: #e4e4e7;
    --accent: #1f6f3f;
    --accent-soft: #e6f2ea;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
  html, body { margin: 0; padding: 0; background: var(--bg); color: var(--text); }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Apple SD Gothic Neo", "Malgun Gothic", sans-serif;
    line-height: 1.5;
    padding-bottom: 96px;
  }
  header {
    background: var(--card);
    padding: 18px 16px 14px;
    border-bottom: 1px solid var(--line);
    position: sticky; top: 0; z-index: 10;
  }
  header h1 { margin: 0; font-size: 17px; font-weight: 700; }
  header p { margin: 2px 0 0; font-size: 12px; color: var(--muted); }
  header p.lead { margin: 6px 0 0; font-size: 15px; font-weight: 700; color: var(--accent); }

  .section { padding: 16px; }
  .section h2 { margin: 0 0 10px; font-size: 14px; font-weight: 700; }
  .field { margin-bottom: 12px; }
  .field label { display: block; font-size: 13px; font-weight: 600; margin-bottom: 6px; }
  .field label .req { color: var(--danger); }
  .field input, .field select {
    width: 100%; padding: 12px; font-size: 16px;
    border: 1px solid var(--line); border-radius: 10px; background: #fff;
    appearance: none; color: var(--text);
  }
  .field input:focus, .field select:focus { outline: 2px solid var(--accent); border-color: var(--accent); }

  .hint { font-size: 13px; color: var(--muted); padding: 4px 0; }

  .notice {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    padding: 14px 16px; font-size: 13px; color: var(--muted); line-height: 1.7;
  }
  .notice p { margin: 0 0 6px; padding-left: 12px; position: relative; }
  .notice p::before { content: "·"; position: absolute; left: 2px; }
  .notice p:last-child { margin-bottom: 0; }
  .notice .notice-contact {
    margin-top: 10px; padding-top: 10px; border-top: 1px solid var(--line);
    color: var(--text); font-weight: 600;
  }
  .notice .notice-contact::before { content: none; }

  .grid { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
  .item {
    background: var(--card); border: 1px solid var(--line); border-radius: 12px;
    overflow: hidden; cursor: pointer; transition: border-color .15s, box-shadow .15s;
    display: flex; flex-direction: column;
  }
  .item.selected { border-color: var(--accent); box-shadow: 0 0 0 2px var(--accent-soft); }
  .item .check { position: relative; }
  .item .thumb {
    width: 100%; aspect-ratio: 4 / 3; background: #f0f0f0 center / cover no-repeat;
    display: flex; align-items: center; justify-content: center; color: #a1a1aa; font-size: 12px;
  }
  .item .badge {
    position: absolute; top: 8px; right: 8px;
    width: 24px; height: 24px; border-radius: 50%;
    background: rgba(255,255,255,.9); border: 1px solid var(--line);
    display: flex; align-items: center; justify-content: center;
    font-size: 14px; color: transparent;
  }
  .item.selected .badge { background: var(--accent); border-color: var(--accent); color: #fff; }
  .item .body { padding: 10px; flex: 1; display: flex; flex-direction: column; gap: 3px; }
  .item .name { font-size: 13px; font-weight: 600; }
  .item .code { font-size: 11px; color: var(--muted); }
  .item .price { font-size: 13px; font-weight: 700; margin-top: 2px; }
  .item .list-price { font-size: 11px; color: var(--muted); text-decoration: line-through; }

  .bar {
    position: fixed; left: 0; right: 0; bottom: 0; z-index: 20;
    background: var(--card); border-top: 1px solid var(--line);
    padding: 10px 16px calc(10px + env(safe-area-inset-bottom));
    display: flex; align-items: center; gap: 12px;
  }
  .bar .summary { flex: 1; font-size: 13px; }
  .bar .summary b { font-size: 15px; }
  .bar button {
    padding: 14px 20px; font-size: 15px; font-weight: 700;
    background: var(--accent); color: #fff; border: 0; border-radius: 12px; white-space: nowrap;
  }
  .bar button:disabled { background: #a1a1aa; }

  #etcWrap { display: none; }
  #etcWrap.show { display: block; }
</style>

  ];

  var MODEL_CODE = {
    "레인지로버": "RR",
    "레인지로버 스포츠": "RRS",
    "레인지로버 벨라": "RRV",
    "디펜더 110": "DEF110",
    "디펜더 130": "DEF130",
    "디스커버리": "DISCO",
    "그외": "ALL"
  };
  // ===============================================================

  var selected = {};

  var grid = document.getElementById("grid");
  var hint = document.getElementById("hint");
  var nameEl = document.getElementById("name");
  var modelEl = document.getElementById("model");
  var etcWrap = document.getElementById("etcWrap");
  var etcEl = document.getElementById("etc");
  var countEl = document.getElementById("count");
  var totalEl = document.getElementById("total");
  var submitBtn = document.getElementById("submit");

  function won(n) { return n.toLocaleString("ko-KR"); }

  function visibleProducts() {
    var code = MODEL_CODE[modelEl.value];
    if (!code) return [];
    return PRODUCTS.filter(function (p) {
      return p.models.indexOf("ALL") !== -1 || p.models.indexOf(code) !== -1;
    });
  }

  function render() {
    var list = visibleProducts();
    grid.innerHTML = "";
    if (!modelEl.value) { hint.textContent = "먼저 차량 모델을 선택하세요."; hint.style.display = "block"; return; }
    hint.style.display = "none";
    list.forEach(function (p) {
      var idx = PRODUCTS.indexOf(p);
      var el = document.createElement("div");
      el.className = "item" + (selected[idx] ? " selected" : "");
      el.innerHTML =
        '<div class="check">' +
          '<div class="thumb" style="background-image:url(\'' + p.img + '\')"></div>' +
          '<div class="badge">✓</div>' +
        '</div>' +
        '<div class="body">' +
          '<div class="name">' + p.name + '</div>' +
          '<div class="code">' + p.code + '</div>' +
          '<div class="list-price">' + won(p.listPrice) + '원</div>' +
          '<div class="price">' + won(p.price) + '원</div>' +
        '</div>';
      el.addEventListener("click", function () {
        if (selected[idx]) delete selected[idx]; else selected[idx] = true;
        render(); refresh();
      });
      grid.appendChild(el);
    });
  }

  function selectedList() {
    return Object.keys(selected).map(function (k) { return PRODUCTS[k]; });
  }

  function refresh() {
    var list = selectedList();
    var total = list.reduce(function (s, p) { return s + p.price; }, 0);
    countEl.textContent = list.length;
    totalEl.textContent = won(total);
    var ok = nameEl.value.trim() && modelEl.value && list.length > 0;
    submitBtn.disabled = !ok;
  }

  modelEl.addEventListener("change", function () {
    var isEtc = modelEl.value === "그외";
    etcWrap.classList.toggle("show", isEtc);
    // 모델을 바꾸면 현재 모델에 없는 선택 항목은 해제
    var code = MODEL_CODE[modelEl.value];
    Object.keys(selected).forEach(function (k) {
      var m = PRODUCTS[k].models;
      if (code && m.indexOf("ALL") === -1 && m.indexOf(code) === -1) delete selected[k];
    });
    render(); refresh();
  });
  nameEl.addEventListener("input", refresh);
  etcEl.addEventListener("input", refresh);

  function buildMessage() {
    var model = modelEl.value;
    if (model === "그외" && etcEl.value.trim()) model = "그외 (" + etcEl.value.trim() + ")";
    var list = selectedList();
    var total = list.reduce(function (s, p) { return s + p.price; }, 0);
    var lines = [];
    lines.push("[펫 액세서리 구매 요청]");
    lines.push("이름: " + nameEl.value.trim());
    lines.push("차량: " + model);
    lines.push("-----");
    list.forEach(function (p) {
      lines.push("· " + p.name + " (" + p.code + ") - " + won(p.price) + "원");
    });
    lines.push("-----");
    lines.push("합계: " + won(total) + "원");
    return lines.join("\n");
  }

  submitBtn.addEventListener("click", function () {
    if (submitBtn.disabled) return;
    var body = buildMessage();
    var ua = navigator.userAgent || "";
    var isIOS = /iP(hone|ad|od)/.test(ua) || (/Mac/.test(ua) && "ontouchend" in document);
    var sep = isIOS ? "&" : "?";
    window.location.href = "sms:" + MANAGER_PHONE + sep + "body=" + encodeURIComponent(body);
  });

  render();
  refresh();
</script>
